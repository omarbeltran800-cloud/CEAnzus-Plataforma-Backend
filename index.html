<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala Virtual - CEAnzus</title>
 
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="classroom-container">
        
  
        <header class="header-card">
            <button id="btn-volver" class="btn-volver">VOLVER</button>
            <h1 class="session-title">MATEMÁTICAS 4° | SESIÓN 1</h1>
        </header>

        <div class="main-content">
           
<div class="recordings-module card">
    <h2 class="module-title">GRABACIONES DE CLASES</h2>
    <ul id="recordings-list" class="recordings-list">
       
        <p class="empty-message">Cargando grabaciones...</p>
    </ul>
</div>
            <aside class="side-panel">
                <div class="users-module card">
                    <h2 class="module-title">LISTA DE USUARIOS</h2>
                    <ul id="user-list">
                      
                        <li>Omar (Tú)</li>
                    </ul>
                </div>
                
                <div class="chat-module card">
                    <h2 class="module-title">CHAT</h2>
                    <div class="chat-messages" id="chat-messages">
                  
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
                        <button id="btn-send">Enviar</button>
                    </div>
                </div>
            </aside>

          
            <main class="whiteboard-module card">
                <div class="whiteboard-header">
                    
                    <div class="decorations"></div>
                    <h2 class="whiteboard-title">PIZARRA INTERACTIVA</h2>
                </div>
                <div class="canvas-container">
                  <canvas id="pizarraLienzo" width="800" height="400" style="background-color: #DDECF8; border-radius: 24px; cursor: crosshair;"></canvas>
                </div>
            </main>
        </div>

       
       <footer class="bottom-bar">
        <button id="btnMic" class="control-btn mic-btn" title="Micrófono">🎤</button>
        <button id="btnCam" class="control-btn cam-btn" title="Cámara de Video">📷</button>
        <button id="btnScreen" class="control-btn screen-btn" title="Compartir Pantalla">💻</button>
    </footer>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="script.js"></script>
</body>
</body>
</html>
