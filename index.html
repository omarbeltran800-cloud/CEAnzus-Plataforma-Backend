<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala Virtual - CEAnzus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <button class="btn-volver">VOLVER</button>
        <h2 class="titulo-sesion">MATEMÁTICAS 4° | SESIÓN 1</h2>
    </header>

    <main class="main-container">
        <!-- Columna Izquierda -->
        <aside class="sidebar">
            <div class="card">
                <h3 class="titulo-verde">LISTA DE USUARIOS</h3>
                <p class="texto-azul">Omar (Tú)</p>
            </div>
            
            <div class="card chat-container flex-grow flex-col">
                <h3 class="titulo-verde">CHAT</h3>
                <div class="chat-messages caja-gris flex-grow">
                    <!-- Los mensajes aparecerán aquí -->
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="Escribe un mensaje..." class="chat-input">
                    <button class="btn-enviar">Env</button>
                </div>
            </div>
        </aside>

        <!-- Columna Derecha -->
        <section class="pizarra-container">
            <div class="card flex-grow flex-col">
                <h3 class="titulo-azul">⭐ PIZARRA INTERACTIVA</h3>
                <div class="caja-gris flex-grow"></div>
            </div>
        </section>
    </main>

    <!-- Botones inferiores -->
    <footer class="controles">
        <button id="btn-mic" class="control-btn">🎤</button>
        <button id="btn-cam" class="control-btn">📷</button>
        <button id="btn-screen" class="control-btn">💻</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
